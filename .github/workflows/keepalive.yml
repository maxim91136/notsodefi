name: Keepalive

# GitHub disables scheduled workflows after 60 days without repo activity.
# Re-enabling them via the API resets that timer (no dummy commits needed).
on:
  schedule:
    - cron: '0 4 1 * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Re-enable all workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/workflows" --paginate \
            --jq '.workflows[] | select(.state == "active" or .state == "disabled_inactivity") | .id' |
          while read -r id; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$id/enable"
            echo "enabled $id"
          done
