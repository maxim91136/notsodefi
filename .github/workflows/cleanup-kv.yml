name: "Cleanup: Delete old KV keys"

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old KV keys
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_KV_ID: ${{ secrets.CF_KV_ID }}
        run: |
          for KEY in "metrics:ada" "metrics:avax" "metrics:tao" "metrics:trx" \
            "metrics:aave" "metrics:algorand" "metrics:algo" "metrics:aptos" "metrics:arbitrum" \
            "metrics:avalanche" "metrics:bittensor" "metrics:bnb" "metrics:cardano" \
            "metrics:chainlink" "metrics:cosmos" "metrics:dai" "metrics:fetchai" \
            "metrics:figr-heloc" "metrics:filecoin" "metrics:hedera" "metrics:hyperliquid" \
            "metrics:icp" "metrics:injective" "metrics:lido" "metrics:near" "metrics:polygon" \
            "metrics:solana" "metrics:stellar" "metrics:sui" "metrics:tether" "metrics:ton" \
            "metrics:tron" "metrics:uniswap" "metrics:usd1" "metrics:usdc" \
            "metrics:virtuals-protocol" "metrics:xrp" "metrics:zcash"; do
            echo "Deleting $KEY..."
            HTTP_STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" -X DELETE \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces/${CF_KV_ID}/values/${KEY}" \
              -H "Authorization: Bearer ${CF_API_TOKEN}")

            if [ "$HTTP_STATUS" = "200" ]; then
              echo "  Deleted $KEY"
            else
              echo "  Failed to delete $KEY (HTTP $HTTP_STATUS)"
              cat /tmp/response.json
            fi
          done
          echo "Done!"
